name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI never needs to change anything in the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Build and test
        run: |
          # No certificates here, so sign to run locally. The tests run inside the app,
          # and both need a signature for the test bundle to load.
          xcodebuild test \
            -project Bouncer.xcodeproj \
            -scheme Bouncer \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=
